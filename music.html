<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线音乐播放器 - ToolBox</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      --music-primary: #6366f1;
      --music-bg: #0f0f1a;
      --music-card: #1a1a2e;
      --music-card-hover: #252540;
      --music-text: #e0e0e0;
      --music-text-light: #8888aa;
      --music-border: #2a2a44;
      --music-player-bg: #16162a;
      --music-progress: #2a2a44;
      --music-progress-fill: #6366f1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--music-bg);
      color: var(--music-text);
      min-height: 100vh;
    }
    .music-page { max-width: 900px; margin: 0 auto; padding: 20px 16px 120px; }
    .music-header { text-align: center; padding: 30px 0 24px; }
    .music-header h1 {
      font-size: 28px;
      background: linear-gradient(135deg, #6366f1, #a78bfa, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .music-header p { color: var(--music-text-light); font-size: 13px; margin-top: 6px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
    .search-box input {
      flex: 1; padding: 12px 16px; border: 2px solid var(--music-border);
      border-radius: 12px; background: var(--music-card); color: var(--music-text);
      font-size: 15px; outline: none; transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--music-primary); }
    .search-btn {
      padding: 12px 24px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff;
      font-size: 15px; cursor: pointer; transition: opacity 0.2s; white-space: nowrap;
    }
    .search-btn:hover { opacity: 0.85; }
    .search-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .hot-section { margin-bottom: 20px; }
    .hot-header {
      font-size: 16px; font-weight: 600; padding: 10px 0 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .hot-header .badge {
      font-size: 11px; background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; padding: 2px 8px; border-radius: 10px; font-weight: 500;
    }
    .hot-header .update-time { font-size: 11px; color: var(--music-text-light); font-weight: 400; margin-left: auto; }
    .fav-section { border-top: 1px solid var(--music-border); margin-top: 20px; padding-top: 4px; }
    .fav-list { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0 4px; }
    .fav-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 12px; background: var(--music-card); border: 1px solid var(--music-border);
      border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.2s;
    }
    .fav-tag:hover { border-color: var(--music-primary); background: var(--music-card-hover); }
    .fav-tag .del { font-size: 11px; opacity: 0.5; cursor: pointer; margin-left: 4px; }
    .fav-tag .del:hover { opacity: 1; }
    .hot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .hot-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 10px; background: var(--music-card); cursor: pointer;
      transition: background 0.15s;
    }
    .hot-item:hover { background: var(--music-card-hover); }
    .hot-item.playing { background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); }
    .hot-item .rank { width: 24px; text-align: center; font-size: 13px; font-weight: 700; color: var(--music-text-light); flex-shrink: 0; }
    .hot-item .rank.top3 { color: #f59e0b; }
    .hot-item .hot-info { flex: 1; min-width: 0; }
    .hot-item .hot-info .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hot-item .hot-info .artist { font-size: 11px; color: var(--music-text-light); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hot-item .play-icon { font-size: 14px; color: var(--music-primary); flex-shrink: 0; opacity: 0; transition: opacity 0.15s; }
    .hot-item:hover .play-icon { opacity: 1; }
    .search-status { text-align: center; padding: 60px 20px; color: var(--music-text-light); }
    .search-status .icon { font-size: 48px; margin-bottom: 16px; }
    .search-status .text { font-size: 14px; line-height: 1.6; }
    .song-list { display: flex; flex-direction: column; gap: 6px; }
    .song-item {
      display: flex; align-items: center; padding: 10px 14px; border-radius: 10px;
      background: var(--music-card); cursor: pointer; transition: background 0.15s; gap: 12px;
    }
    .song-item:hover { background: var(--music-card-hover); }
    .song-item.playing { background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); }
    .song-album-art { width: 46px; height: 46px; border-radius: 8px; background: var(--music-border); flex-shrink: 0; overflow: hidden; }
    .song-album-art img { width: 100%; height: 100%; object-fit: cover; }
    .song-album-art .placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .song-info { flex: 1; min-width: 0; }
    .song-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { font-size: 12px; color: var(--music-text-light); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-duration { font-size: 12px; color: var(--music-text-light); flex-shrink: 0; }
    .song-fav-star { cursor: pointer; font-size: 16px; padding: 0 8px; user-select: none; flex-shrink: 0; transition: transform 0.15s; }
    .song-fav-star:hover { transform: scale(1.2); }
    .song-play-icon { font-size: 18px; color: var(--music-primary); flex-shrink: 0; width: 32px; text-align: center; }
    .player-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--music-player-bg);
      border-top: 1px solid var(--music-border); padding: 12px 20px; z-index: 100;
      backdrop-filter: blur(20px); display: none;
    }
    .player-bar.active { display: block; }
    .player-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
    .player-info { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 0 0 220px; }
    .player-album { width: 44px; height: 44px; border-radius: 8px; flex-shrink: 0; overflow: hidden; }
    .player-album img { width: 100%; height: 100%; object-fit: cover; }
    .player-text { min-width: 0; }
    .player-text .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-text .artist { font-size: 11px; color: var(--music-text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-controls { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .player-buttons { display: flex; align-items: center; gap: 16px; }
    .player-btn { background: none; border: none; color: var(--music-text); font-size: 20px; cursor: pointer; padding: 4px; transition: color 0.15s; line-height: 1; }
    .player-btn:hover { color: var(--music-primary); }
    .player-btn.play-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--music-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .player-btn.play-btn:hover { opacity: 0.85; }
    .player-btn.lyrics-btn { font-size: 16px; padding: 4px; margin-left: 4px; position: relative; }
    .player-btn.lyrics-btn.has-lyrics::after { content: ''; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: #a78bfa; }
    .player-btn.lyrics-btn.active { color: #a78bfa; }
    .player-progress { width: 100%; max-width: 400px; display: flex; align-items: center; gap: 10px; }
    .progress-time { font-size: 11px; color: var(--music-text-light); min-width: 36px; font-variant-numeric: tabular-nums; }
    .progress-bar { flex: 1; height: 4px; background: var(--music-progress); border-radius: 2px; cursor: pointer; position: relative; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #a78bfa); border-radius: 2px; width: 0%; transition: width 0.1s linear; }
    .progress-bar:hover .progress-fill { height: 6px; margin-top: -1px; }
    .player-volume { flex: 0 0 100px; display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
    .player-volume .vol-btn { background: none; border: none; color: var(--music-text-light); font-size: 16px; cursor: pointer; padding: 2px; transition: color 0.15s; }
    .player-volume .vol-btn:hover { color: var(--music-text); }
    .vol-bar { width: 60px; height: 4px; background: var(--music-progress); border-radius: 2px; cursor: pointer; position: relative; }

    /* ---- 歌词面板 ---- */
    .lyrics-panel {
      max-width: 900px; margin: 0 auto; padding: 0 16px 20px;
      background: var(--music-card); border-radius: 16px; border: 1px solid var(--music-border);
    }
    .lyrics-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px 8px; font-size: 14px; color: var(--music-text-light);
    }
    .lyrics-close { cursor: pointer; font-size: 16px; opacity: 0.6; }
    .lyrics-close:hover { opacity: 1; }
    .lyrics-scroll {
      height: 280px; overflow-y: auto; padding: 8px 16px 20px;
      scroll-behavior: smooth;
    }
    .lyrics-scroll::-webkit-scrollbar { width: 4px; }
    .lyrics-scroll::-webkit-scrollbar-thumb { background: var(--music-border); border-radius: 2px; }
    .lyrics-empty {
      text-align: center; color: var(--music-text-light); padding: 60px 0; font-size: 14px;
    }
    .lyrics-line {
      padding: 8px 0; font-size: 15px; line-height: 1.6; text-align: center;
      color: var(--music-text-light); transition: all 0.3s; cursor: default;
    }
    .lyrics-line.active {
      color: #fff; font-size: 17px; font-weight: 600;
      text-shadow: 0 0 20px rgba(99,102,241,0.5);
    }
    .lyrics-line.past { color: #666; font-size: 13px; }
    .vol-fill { height: 100%; background: var(--music-text-light); border-radius: 2px; width: 60%; }
    .loading-dots::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
    .smooth-btn-wrap { text-align: center; margin: 12px 0 18px; }
    .smooth-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 12px 32px; border: none;
      border-radius: 16px; background: linear-gradient(135deg, #10b981, #059669); color: #fff;
      font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
    }
    .smooth-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(16, 185, 129, 0.4); }
    .smooth-section { margin-bottom: 20px; }
    .smooth-header { font-size: 16px; font-weight: 600; padding: 10px 0 12px; display: flex; align-items: center; gap: 8px; }
    .smooth-header .count { font-size: 12px; color: var(--music-text-light); font-weight: 400; }
    .smooth-header .back-btn { margin-left: auto; font-size: 12px; color: var(--music-primary); cursor: pointer; background: none; border: none; padding: 4px 10px; border-radius: 8px; }
    .smooth-header .back-btn:hover { background: rgba(99, 102, 241, 0.1); }
    .smooth-list { display: flex; flex-direction: column; gap: 4px; }
    .smooth-item {
      display: flex; align-items: center; padding: 10px 14px; border-radius: 10px;
      background: var(--music-card); cursor: pointer; transition: background 0.15s; gap: 12px;
    }
    .smooth-item:hover { background: var(--music-card-hover); }
    .smooth-item.playing { background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.25); }
    .smooth-item .s-index { width: 28px; font-size: 12px; color: var(--music-text-light); text-align: center; flex-shrink: 0; }
    .smooth-item .s-info { flex: 1; min-width: 0; }
    .smooth-item .s-info .s-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .smooth-item .s-info .s-artist { font-size: 12px; color: var(--music-text-light); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .smooth-item .s-fav { font-size: 16px; flex-shrink: 0; width: 28px; text-align: center; opacity: 0.4; transition: opacity 0.15s; }
    .smooth-item .s-fav.faved { opacity: 1; }
    .smooth-item:hover .s-fav { opacity: 0.8; }
    .smooth-item:hover .s-fav.faved { opacity: 1; }
    .smooth-item .s-play-icon { font-size: 14px; color: var(--music-primary); flex-shrink: 0; width: 24px; text-align: center; }
    .fav-section { margin-bottom: 20px; padding: 12px 16px; border-radius: 12px; background: rgba(245, 158, 11, 0.06); border: 1px solid rgba(245, 158, 11, 0.15); }
    .fav-header { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; padding-bottom: 8px; }
    .fav-header .fav-count { font-size: 12px; color: var(--music-text-light); font-weight: 400; }
    .fav-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .fav-tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 8px; background: rgba(245, 158, 11, 0.1); font-size: 12px; cursor: pointer; transition: background 0.15s; }
    .fav-tag:hover { background: rgba(245, 158, 11, 0.2); }
    .fav-tag .del { font-size: 14px; opacity: 0.5; margin-left: 2px; }
    .fav-tag .del:hover { opacity: 1; }
    @media (max-width: 640px) {
      .player-inner { flex-wrap: wrap; }
      .player-info { flex: 0 0 100%; order: -1; }
      .player-volume { display: none; }
      .player-progress { max-width: 100%; }
      .music-header h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
<div class="music-page">
  <div class="music-header">
    <h1>🎵 在线音乐播放器</h1>
    <p>基于 LX Music 生态 · 网易云音乐源 · 在线免费听</p>
  </div>

  <div class="smooth-btn-wrap">
    <button class="smooth-btn" onclick="showSmoothPlay()">✨ 顺畅播放 · 必能听</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索歌曲、歌手..." 
           onkeydown="if(event.key==='Enter') searchMusic(); if(event.key==='Escape') backToHome()">
    <button class="search-btn" id="searchBtn" onclick="searchMusic()">🔍 搜索</button>
  </div>

  <div class="fav-section" id="favSection" style="display:none">
    <div class="fav-header">⭐ 我的收藏 <span class="fav-count" id="favCount">(0)</span></div>
    <div class="fav-list" id="favList"></div>
  </div>

  <div class="smooth-section" id="smoothSection" style="display:none">
    <div class="smooth-header">
      ✨ 顺畅播放 · 缓存曲库
      <span class="count" id="smoothCount"></span>
      <button class="back-btn" onclick="backToHome()">← 返回首页</button>
    </div>
    <div class="smooth-list" id="smoothList">
      <div class="search-status" style="padding:20px"><div class="text">加载中...</div></div>
    </div>
  </div>

  <div class="hot-section" id="hotSection">
    <div class="hot-header">
      🔥 热门推荐 <span class="badge">网易云热歌榜</span>
      <span class="update-time" id="hotUpdateTime"></span>
    </div>
    <div class="hot-grid" id="hotGrid">
      <div class="search-status" style="padding:20px"><div class="text">加载中...</div></div>
    </div>
    <!-- 已收藏的歌曲 -->
    <div class="fav-section" id="favSection" style="display:none;margin-top:20px">
      <div class="hot-header">
        ⭐ 我的收藏 <span class="badge" id="favCount">(0)</span>
      </div>
      <div class="fav-list" id="favList"></div>
    </div>
  </div>

  <div id="searchResults" style="display:none">
    <div class="search-status">
      <div class="icon">🎶</div>
      <div class="text">输入歌名或歌手，点击搜索<br>网易云音乐海量曲库</div>
    </div>
  </div>
</div>

<!-- 歌词面板 -->
<div class="lyrics-panel" id="lyricsPanel" style="display:none">
  <div class="lyrics-header">
    <span>📜 歌词</span>
    <span class="lyrics-close" onclick="toggleLyrics()">✕</span>
  </div>
  <div class="lyrics-scroll" id="lyricsScroll">
    <div class="lyrics-empty" id="lyricsEmpty">暂无歌词</div>
    <div class="lyrics-lines" id="lyricsLines"></div>
  </div>
</div>

<div class="player-bar" id="playerBar">
  <div class="player-inner">
    <div class="player-info">
      <div class="player-album" id="playerAlbum">
        <img src="" alt="" id="playerAlbumImg" style="display:none">
        <div class="placeholder" id="playerAlbumPlaceholder" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#2a2a44;font-size:20px;">🎵</div>
      </div>
      <div class="player-text">
        <div class="name" id="playerSongName">未选择歌曲</div>
        <div class="artist" id="playerArtist">-</div>
      </div>
    </div>
    <div class="player-controls">
      <div class="player-buttons">
        <button class="player-btn" onclick="prevSong()" title="上一首">⏮</button>
        <button class="player-btn play-btn" id="playBtn" onclick="togglePlay()">▶</button>
        <button class="player-btn" onclick="nextSong()" title="下一首">⏭</button>
        <button class="player-btn lyrics-btn" id="lyricsBtn" onclick="toggleLyrics()" title="歌词">📜</button>
      </div>
      <div class="player-progress">
        <span class="progress-time" id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar" onclick="seekProgress(event)">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="progress-time" id="totalTime">0:00</span>
      </div>
    </div>
    <div class="player-volume">
      <button class="vol-btn" id="volBtn" onclick="toggleMute()">🔊</button>
      <div class="vol-bar" onclick="setVolume(event)">
        <div class="vol-fill" id="volFill"></div>
      </div>
    </div>
  </div>
</div>

<audio id="audioPlayer" preload="auto" 
       controlsList="nodownload noplaybackrate" 
       oncontextmenu="return false;"
       style="display:none"></audio>

<script>
// ============================================================
// 音乐播放器 - 基于 LX Music 生态
// 搜索: 网易云音乐 API (netease-cloud-music-api-xi-pied.vercel.app)
// 播放: ChKSz API (api.chksz.top) - 来自 LX Music 生态
// 热歌: 网易云热歌榜
// ============================================================

const NETEASE_API = 'https://netease-cloud-music-api-xi-pied.vercel.app';
const CHKSZ_API = 'https://api.chksz.top/api/163_music';

let currentSongList = [];
let currentIndex = -1;
let isPlaying = false;
let isMuted = false;
let previousVolume = 0.6;

const audio = document.getElementById('audioPlayer');
const playerBar = document.getElementById('playerBar');
const playBtn = document.getElementById('playBtn');
const progressFill = document.getElementById('progressFill');
const progressBar = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const volFill = document.getElementById('volFill');
const volBtn = document.getElementById('volBtn');
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
const searchBtn = document.getElementById('searchBtn');

audio.volume = 0.6;
updateVolUI();

// ---- 热门推荐 ----
const hotSection = document.getElementById('hotSection');
const hotGrid = document.getElementById('hotGrid');
const hotUpdateTime = document.getElementById('hotUpdateTime');

async function loadHotSongs() {
  try {
    // 从网易云热歌榜获取
    const resp = await fetch(`${NETEASE_API}/playlist/track/all?id=3778678&limit=48`);
    const data = await resp.json();
    const songs = (data.songs || []).map(s => ({
      id: String(s.id),
      name: s.name,
      artists: (s.ar || []).map(a => a.name),
      album: s.al?.name || '',
      albumPic: s.al?.picUrl || '',
      duration: s.dt || 0,
      source: 'netease'
    }));
    
    if (songs.length === 0) {
      hotGrid.innerHTML = '<div class="search-status" style="padding:20px"><div class="text">暂无热门歌曲，试试搜索吧</div></div>';
      return;
    }
    
    hotUpdateTime.textContent = `网易云热歌榜`;
    
    let html = '';
    songs.forEach((song, idx) => {
      const rank = idx + 1;
      const rankClass = rank <= 3 ? 'top3' : '';
      const artists = song.artists?.join(' / ') || '';
      html += `
        <div class="hot-item" onclick="playHotSong(${idx})" data-index="${idx}">
          <div class="rank ${rankClass}">${rank}</div>
          <div class="hot-info">
            <div class="name">${song.name}</div>
            <div class="artist">${artists}</div>
          </div>
          <div class="play-icon">▶</div>
        </div>
      `;
    });
    
    hotGrid.innerHTML = html;
    window._hotSongs = songs;
  } catch (e) {
    hotGrid.innerHTML = '<div class="search-status" style="padding:20px"><div class="text">加载失败，试试搜索</div></div>';
  }
}

function playHotSong(index) {
  const songs = window._hotSongs || [];
  const song = songs[index];
  if (!song) return;
  currentSongList = songs;
  playSong(index);
}

loadHotSongs();

// ---- 搜索（网易云） ----
async function searchMusic() {
  const keyword = searchInput.value.trim();
  if (!keyword) return;
  
  hotSection.style.display = 'none';
  searchResults.style.display = 'block';
  
  searchBtn.disabled = true;
  searchBtn.textContent = '⏳ 搜索中...';
  searchResults.innerHTML = '<div class="search-status"><div class="icon">🔍</div><div class="text">正在搜索...</div></div>';
  
  try {
    const resp = await fetch(`${NETEASE_API}/search?keywords=${encodeURIComponent(keyword)}&limit=30`);
    const data = await resp.json();
    const songs = (data.result?.songs || []).map(s => ({
      id: String(s.id),
      name: s.name,
      artists: s.artists ? s.artists.map(a => a.name) : [],
      album: s.album?.name || '',
      albumPic: s.album?.picUrl || '',
      duration: s.duration || 0,
      source: 'netease'
    }));
    renderSongs(songs);
  } catch (e) {
    searchResults.innerHTML = '<div class="search-status"><div class="icon">😅</div><div class="text">搜索失败，请稍后重试</div></div>';
  } finally {
    searchBtn.disabled = false;
    searchBtn.textContent = '🔍 搜索';
  }
}

function backToHome() {
  searchInput.value = '';
  searchResults.style.display = 'none';
  smoothSection.style.display = 'none';
  hotSection.style.display = 'block';
  loadHotSongs();
}

// ---- 顺畅播放（基于本地缓存） ----
const smoothSection = document.getElementById('smoothSection');
const smoothList = document.getElementById('smoothList');
const smoothCount = document.getElementById('smoothCount');
let _allCachedSongs = [];

function showSmoothPlay() {
  hotSection.style.display = 'none';
  searchResults.style.display = 'none';
  smoothSection.style.display = 'block';
  smoothList.innerHTML = '<div class="search-status" style="padding:20px"><div class="text">加载中...</div></div>';
  loadAllCachedSongs();
}

async function loadAllCachedSongs() {
  try {
    // 从网易云热歌榜获取更多歌曲
    const resp = await fetch(`${NETEASE_API}/playlist/track/all?id=3778678&limit=200`);
    const data = await resp.json();
    _allCachedSongs = (data.songs || []).map(s => ({
      id: String(s.id),
      name: s.name,
      artists: (s.ar || []).map(a => a.name),
      album: s.al?.name || '',
      albumPic: s.al?.picUrl || '',
      duration: s.dt || 0,
      source: 'netease'
    }));
    
    if (_allCachedSongs.length === 0) {
      smoothList.innerHTML = '<div class="search-status" style="padding:20px"><div class="text">暂无缓存歌曲</div></div>';
      return;
    }
    
    smoothCount.textContent = `共 ${_allCachedSongs.length} 首 · 网易云热歌榜`;
    renderSmoothList();
  } catch (e) {
    smoothList.innerHTML = '<div class="search-status" style="padding:20px"><div class="text">加载失败</div></div>';
  }
}

function renderSmoothList() {
  const favs = getFavorites();
  let html = '';
  _allCachedSongs.forEach((song, idx) => {
    const artists = song.artists?.join(' / ') || '';
    const isFaved = favs.some(s => s.id === song.id);
    html += `
      <div class="smooth-item" onclick="playSmooth(${idx})" data-index="${idx}">
        <div class="s-index">${idx + 1}</div>
        <div class="s-info">
          <div class="s-name">${song.name}</div>
          <div class="s-artist">${artists}</div>
        </div>
        <div class="s-fav ${isFaved ? 'faved' : ''}" onclick="event.stopPropagation(); toggleFav('${song.id}')">${isFaved ? '⭐' : '☆'}</div>
        <div class="s-play-icon">▶</div>
      </div>
    `;
  });
  smoothList.innerHTML = html;
}

function playSmooth(index) {
  const song = _allCachedSongs[index];
  if (!song) return;
  currentSongList = _allCachedSongs;
  playSong(index);
}

// ---- 收藏（持久化存储完整歌曲数据） ----
function getFavorites() {
  try { return JSON.parse(localStorage.getItem('musicFavs') || '[]'); } catch { return []; }
}
function saveFavorites(favs) { localStorage.setItem('musicFavs', JSON.stringify(favs)); }

function toggleFav(songId) {
  // 从当前歌曲列表中找到完整歌曲数据
  const song = currentSongList.find(s => s.id === songId) || _allCachedSongs.find(s => s.id === songId);
  if (!song) return;
  
  let favs = getFavorites();
  const idx = favs.findIndex(s => s.id === songId);
  if (idx >= 0) {
    favs.splice(idx, 1);
  } else {
    // 存入完整数据：id, name, artists, albumPic, duration
    favs.push({
      id: song.id,
      name: song.name,
      artists: song.artists || [],
      albumPic: song.albumPic || '',
      duration: song.duration || 0
    });
  }
  saveFavorites(favs);
  renderFavSection();
  refreshSongListFavs();
}

function refreshSongListFavs() {
  const favs = getFavorites();
  document.querySelectorAll('.fav-star').forEach(el => {
    const id = el.dataset.sid;
    el.textContent = favs.some(s => s.id === id) ? '⭐' : '☆';
  });
}

function renderFavSection() {
  const favs = getFavorites();
  const favSection = document.getElementById('favSection');
  const favList = document.getElementById('favList');
  const favCount = document.getElementById('favCount');
  if (favs.length === 0) { favSection.style.display = 'none'; return; }
  favSection.style.display = 'block';
  favCount.textContent = `(${favs.length})`;
  let html = '';
  favs.forEach(song => {
    const name = song.name || song.id;
    const artists = (song.artists || []).join(' / ');
    html += `<div class="fav-tag" onclick="playFavById('${song.id}')" title="${name} - ${artists}">
      ⭐ ${name} <span class="del" onclick="event.stopPropagation(); toggleFav('${song.id}')">✕</span>
    </div>`;
  });
  favList.innerHTML = html;
}
renderFavSection();

function playFavById(songId) {
  // 先从当前列表找，再从收藏数据里找
  const song = currentSongList.find(s => s.id === songId) || _allCachedSongs.find(s => s.id === songId) || getFavorites().find(s => s.id === songId);
  if (!song) return;
  // 构建歌曲数据并播放
  const songData = { id: song.id, name: song.name, artists: song.artists || [], albumPic: song.albumPic || '', duration: song.duration || 0, source: 'netease' };
  currentSongList = [songData];
  playSong(0);
}

function renderSongs(songs) {
  if (songs.length === 0) {
    searchResults.innerHTML = '<div class="search-status"><div class="icon">😕</div><div class="text">未找到相关歌曲，换个关键词试试</div></div>';
    return;
  }
  currentSongList = songs;
  let html = '<div class="song-list">';
  songs.forEach((song, idx) => {
    const artists = song.artists.join(' / ');
    const duration = formatDuration(song.duration);
    const albumPic = song.albumPic || '';
    const isActive = idx === currentIndex;
    const favs = getFavorites();
    const isFaved = favs.some(s => s.id === song.id);
    html += `
      <div class="song-item ${isActive ? 'playing' : ''}" onclick="playSong(${idx})" data-index="${idx}">
        <div class="song-album-art">
          ${albumPic ? `<img src="${albumPic}?param=100y100" alt="" loading="lazy">` : '<div class="placeholder">🎵</div>'}
        </div>
        <div class="song-info">
          <div class="song-name">${song.name}</div>
          <div class="song-artist">${artists}</div>
        </div>
        <div class="song-duration">${duration}</div>
        <div class="song-fav-star fav-star" data-sid="${song.id}" onclick="event.stopPropagation(); toggleFav('${song.id}')">${isFaved ? '⭐' : '☆'}</div>
        <div class="song-play-icon">${isActive ? '🔊' : '▶'}</div>
      </div>
    `;
  });
  html += '</div>';
  searchResults.innerHTML = html;
}

// ---- 播放（通过 ChKSz API 获取真实播放链接） ----
async function playSong(index) {
  const song = currentSongList[index];
  if (!song) return;
  currentIndex = index;
  
  document.getElementById('playerSongName').textContent = song.name;
  document.getElementById('playerArtist').textContent = song.artists.join(' / ');
  
  const albumImg = document.getElementById('playerAlbumImg');
  const placeholder = document.getElementById('playerAlbumPlaceholder');
  if (song.albumPic) {
    albumImg.src = song.albumPic + '?param=100y100';
    albumImg.style.display = 'block';
    placeholder.style.display = 'none';
  } else {
    albumImg.style.display = 'none';
    placeholder.style.display = 'flex';
  }
  
  playerBar.classList.add('active');
  playBtn.textContent = '⏳';
  
  // 通过 ChKSz API 获取播放链接
  try {
    const url = await getNeteaseUrl(song.id);
    if (url) {
      audio.src = url;
      // 加载歌词
      loadLyrics(song.id);
      await audio.play().catch(() => {
        showToast('⚠️ 播放失败，尝试下一首');
        nextSong();
      });
    } else {
      showToast('⚠️ 该歌曲暂不可播放（版权限制或需会员）');
      playBtn.textContent = '▶';
    }
  } catch (e) {
    showToast('⚠️ 获取播放链接失败');
    playBtn.textContent = '▶';
  }
  
  // 更新高亮
  document.querySelectorAll('.song-item, .smooth-item, .hot-item').forEach(el => el.classList.remove('playing'));
  document.querySelectorAll(`[data-index="${index}"]`).forEach(el => el.classList.add('playing'));
}

// 通过 ChKSz API 获取网易云歌曲播放链接（多音质回退）
async function getNeteaseUrl(id) {
  const levels = ['jymaster', 'sky', 'hires', 'flac', '320k', '192k', '128k'];
  for (const level of levels) {
    try {
      const resp = await fetch(`${CHKSZ_API}?id=${id}&level=${level}`);
      const data = await resp.json();
      if (data.code === 200 && data.data?.url) {
        return data.data.url;
      }
    } catch (e) {
      // 继续尝试下一个音质级别
    }
  }
  return null;
}

// ---- 歌词 ----
let _currentLyrics = [];
let _lyricsId = null;
let _lyricsTimer = null;

async function loadLyrics(songId) {
  _lyricsId = songId;
  const lyricsLines = document.getElementById('lyricsLines');
  const lyricsEmpty = document.getElementById('lyricsEmpty');
  lyricsLines.innerHTML = '';
  lyricsEmpty.style.display = 'block';
  lyricsEmpty.textContent = '⏳ 加载歌词...';
  
  try {
    const resp = await fetch(`${NETEASE_API}/lyric?id=${songId}`);
    const data = await resp.json();
    const lrcText = data.lrc?.lyric || '';
    if (!lrcText) {
      lyricsEmpty.textContent = '📜 暂无歌词';
      _currentLyrics = [];
      return;
    }
    _currentLyrics = parseLrc(lrcText);
    lyricsEmpty.style.display = 'none';
    document.getElementById('lyricsBtn').classList.add('has-lyrics');
    let html = '';
    _currentLyrics.forEach((line, i) => {
      html += `<div class="lyrics-line" data-lyric-index="${i}">${escapeHtml(line.text) || '⋯'}</div>`;
    });
    lyricsLines.innerHTML = html;
    // 如果歌词面板已打开，立即同步
    if (document.getElementById('lyricsPanel').style.display !== 'none') {
      updateLyrics();
    }
  } catch (e) {
    lyricsEmpty.textContent = '😅 歌词加载失败';
    _currentLyrics = [];
  }
}

function parseLrc(lrcText) {
  const lines = lrcText.split('\n');
  const result = [];
  const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/g;
  
  for (const line of lines) {
    const match = line.match(timeRegex);
    if (!match) continue;
    const text = line.replace(timeRegex, '').trim();
    // 跳过纯元数据行
    if (!text || text.startsWith('作曲') || text.startsWith('作词') || text.startsWith('编曲') || text.startsWith('制作')) continue;
    for (const ts of match) {
      const parts = ts.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\]/);
      if (!parts) continue;
      let secs = parseInt(parts[1]) * 60 + parseInt(parts[2]);
      // 毫秒转秒
      if (parts[3].length === 3) secs += parseInt(parts[3]) / 1000;
      else secs += parseInt(parts[3]) / 100;
      result.push({ time: secs, text });
    }
  }
  result.sort((a, b) => a.time - b.time);
  return result;
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function updateLyrics() {
  if (_currentLyrics.length === 0) return;
  const currentTime = audio.currentTime || 0;
  let activeIndex = -1;
  
  for (let i = _currentLyrics.length - 1; i >= 0; i--) {
    if (currentTime >= _currentLyrics[i].time) {
      activeIndex = i;
      break;
    }
  }
  
  const lines = document.querySelectorAll('.lyrics-line');
  lines.forEach((el, i) => {
    el.classList.remove('active', 'past');
    if (i < activeIndex) el.classList.add('past');
    else if (i === activeIndex) el.classList.add('active');
  });
  
  // 滚动到当前行
  if (activeIndex >= 0 && lines[activeIndex]) {
    const scroll = document.getElementById('lyricsScroll');
    const activeEl = lines[activeIndex];
    const offset = activeEl.offsetTop - scroll.offsetTop - scroll.clientHeight / 2 + activeEl.clientHeight / 2;
    scroll.scrollTop = Math.max(0, offset);
  }
}

function toggleLyrics() {
  const panel = document.getElementById('lyricsPanel');
  const btn = document.getElementById('lyricsBtn');
  if (panel.style.display === 'none') {
    panel.style.display = 'block';
    btn.classList.add('active');
    if (_currentLyrics.length > 0) updateLyrics();
  } else {
    panel.style.display = 'none';
    btn.classList.remove('active');
  }
}

// ---- 播放控制 ----
function togglePlay() {
  if (audio.src) {
    if (audio.paused) audio.play().catch(() => {});
    else audio.pause();
  } else if (currentSongList.length > 0) {
    playSong(currentIndex >= 0 ? currentIndex : 0);
  }
}
function prevSong() {
  if (currentSongList.length === 0) return;
  currentIndex = (currentIndex - 1 + currentSongList.length) % currentSongList.length;
  playSong(currentIndex);
}
function nextSong() {
  if (currentSongList.length === 0) return;
  currentIndex = (currentIndex + 1) % currentSongList.length;
  playSong(currentIndex);
}

// ---- 音频事件 ----
audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
  }
  // 同步歌词
  if (_currentLyrics.length > 0 && document.getElementById('lyricsPanel').style.display !== 'none') {
    updateLyrics();
  }
});
audio.addEventListener('loadedmetadata', () => { totalTimeEl.textContent = formatTime(audio.duration); });
audio.addEventListener('play', () => { isPlaying = true; playBtn.textContent = '⏸'; });
audio.addEventListener('pause', () => { isPlaying = false; playBtn.textContent = '▶'; });
audio.addEventListener('ended', () => { nextSong(); });
audio.addEventListener('error', () => {
  if (audio.src) { showToast('⚠️ 播放出错，尝试下一首'); nextSong(); }
});

function seekProgress(e) {
  const rect = progressBar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  if (audio.duration) audio.currentTime = pct * audio.duration;
}
function setVolume(e) {
  const rect = document.querySelector('.vol-bar').getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  audio.volume = pct; isMuted = false; updateVolUI();
}
function toggleMute() {
  isMuted = !isMuted;
  if (isMuted) { previousVolume = audio.volume; audio.volume = 0; }
  else { audio.volume = previousVolume; }
  updateVolUI();
}
function updateVolUI() {
  const vol = isMuted ? 0 : audio.volume;
  volFill.style.width = (vol * 100) + '%';
  volBtn.textContent = vol === 0 ? '🔇' : vol < 0.3 ? '🔈' : vol < 0.7 ? '🔉' : '🔊';
}
function formatTime(seconds) {
  if (!seconds || isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}
function formatDuration(ms) {
  if (!ms) return '--:--';
  const totalSec = Math.floor(ms / 1000);
  return `${Math.floor(totalSec / 60)}:${(totalSec % 60).toString().padStart(2, '0')}`;
}
function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;animation:fadeIn 0.2s';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
document.addEventListener('contextmenu', e => { if (e.target.closest('.player-bar') || e.target === audio) e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowLeft') prevSong();
  if (e.key === 'ArrowRight') nextSong();
  if (e.key === 'Escape') backToHome();
});
</script>
