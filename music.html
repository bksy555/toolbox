<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线音乐播放器 - ToolBox</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      --music-primary: #6366f1;
      --music-bg: #0f0f1a;
      --music-card: #1a1a2e;
      --music-card-hover: #252540;
      --music-text: #e0e0e0;
      --music-text-light: #8888aa;
      --music-border: #2a2a44;
      --music-player-bg: #16162a;
      --music-progress: #2a2a44;
      --music-progress-fill: #6366f1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--music-bg);
      color: var(--music-text);
      min-height: 100vh;
    }

    .music-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px 120px;
    }

    .music-header {
      text-align: center;
      padding: 30px 0 24px;
    }
    .music-header h1 {
      font-size: 28px;
      background: linear-gradient(135deg, #6366f1, #a78bfa, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .music-header p {
      color: var(--music-text-light);
      font-size: 13px;
      margin-top: 6px;
    }

    /* 搜索框 */
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .search-box input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--music-border);
      border-radius: 12px;
      background: var(--music-card);
      color: var(--music-text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: var(--music-primary);
    }
    .search-box input::placeholder {
      color: var(--music-text-light);
    }
    .search-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .search-btn:hover { opacity: 0.85; }
    .search-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 热门推荐 */
    .hot-section {
      margin-bottom: 20px;
    }
    .hot-header {
      font-size: 16px;
      font-weight: 600;
      padding: 10px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hot-header .badge {
      font-size: 11px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }
    .hot-header .update-time {
      font-size: 11px;
      color: var(--music-text-light);
      font-weight: 400;
      margin-left: auto;
    }
    .hot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
    }
    .hot-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--music-card);
      cursor: pointer;
      transition: background 0.15s;
    }
    .hot-item:hover { background: var(--music-card-hover); }
    .hot-item .rank {
      width: 24px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--music-text-light);
      flex-shrink: 0;
    }
    .hot-item .rank.top3 { color: #f59e0b; }
    .hot-item .hot-info {
      flex: 1;
      min-width: 0;
    }
    .hot-item .hot-info .name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hot-item .hot-info .artist {
      font-size: 11px;
      color: var(--music-text-light);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hot-item .play-icon {
      font-size: 14px;
      color: var(--music-primary);
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .hot-item:hover .play-icon { opacity: 1; }

    /* 搜索结果 */
    .search-status {
      text-align: center;
      padding: 60px 20px;
      color: var(--music-text-light);
    }
    .search-status .icon { font-size: 48px; margin-bottom: 16px; }
    .search-status .text { font-size: 14px; line-height: 1.6; }

    .song-list { display: flex; flex-direction: column; gap: 6px; }

    .song-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--music-card);
      cursor: pointer;
      transition: background 0.15s;
      gap: 12px;
    }
    .song-item:hover { background: var(--music-card-hover); }
    .song-item.playing { background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); }

    .song-album-art {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      background: var(--music-border);
      flex-shrink: 0;
      overflow: hidden;
    }
    .song-album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .song-album-art .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }
    .song-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-artist {
      font-size: 12px;
      color: var(--music-text-light);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-duration {
      font-size: 12px;
      color: var(--music-text-light);
      flex-shrink: 0;
    }
    .song-play-icon {
      font-size: 18px;
      color: var(--music-primary);
      flex-shrink: 0;
      width: 32px;
      text-align: center;
    }

    /* 底部播放栏 */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--music-player-bg);
      border-top: 1px solid var(--music-border);
      padding: 12px 20px;
      z-index: 100;
      backdrop-filter: blur(20px);
      display: none;
    }
    .player-bar.active { display: block; }

    .player-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 0 0 220px;
    }
    .player-album {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .player-album img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .player-text {
      min-width: 0;
    }
    .player-text .name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-text .artist {
      font-size: 11px;
      color: var(--music-text-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .player-buttons {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .player-btn {
      background: none;
      border: none;
      color: var(--music-text);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      transition: color 0.15s;
      line-height: 1;
    }
    .player-btn:hover { color: var(--music-primary); }
    .player-btn.play-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--music-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .player-btn.play-btn:hover { opacity: 0.85; }

    .player-progress {
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-time {
      font-size: 11px;
      color: var(--music-text-light);
      min-width: 36px;
      font-variant-numeric: tabular-nums;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      background: var(--music-progress);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a78bfa);
      border-radius: 2px;
      width: 0%;
      transition: width 0.1s linear;
    }
    .progress-bar:hover .progress-fill {
      height: 6px;
      margin-top: -1px;
    }

    .player-volume {
      flex: 0 0 120px;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
    }
    .player-volume .vol-btn {
      background: none;
      border: none;
      color: var(--music-text-light);
      font-size: 16px;
      cursor: pointer;
      padding: 2px;
    }
    .player-volume .vol-btn:hover { color: var(--music-text); }
    .vol-bar {
      width: 60px;
      height: 4px;
      background: var(--music-progress);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .vol-fill {
      height: 100%;
      background: var(--music-text-light);
      border-radius: 2px;
      width: 60%;
    }

    /* 隐藏原生下载按钮 */
    audio::-internal-media-controls-download-button { display: none; }
    audio::-webkit-media-controls-enclosure { overflow: hidden; }
    audio::-webkit-media-controls-panel { width: calc(100% + 30px); }

    /* 加载动画 */
    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    @media (max-width: 640px) {
      .player-inner { flex-wrap: wrap; }
      .player-info { flex: 0 0 100%; order: -1; }
      .player-volume { display: none; }
      .player-progress { max-width: 100%; }
      .music-header h1 { font-size: 22px; }
    }
  </style>
</head>
<body>

<div class="music-page">
  <div class="music-header">
    <h1>🎵 在线音乐播放器</h1>
    <p>搜索歌曲和歌手，在线免费听 · 支持网易云音乐源</p>
  </div>

  <!-- 搜索框 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索歌曲、歌手..." 
           onkeydown="if(event.key==='Enter') searchMusic(); if(event.key==='Escape') clearSearch()">
    <button class="search-btn" id="searchBtn" onclick="searchMusic()">🔍 搜索</button>
  </div>

  <!-- 热门推荐 -->
  <div class="hot-section" id="hotSection">
    <div class="hot-header">
      🔥 热门推荐
      <span class="badge">预加载 秒播放</span>
      <span class="update-time" id="hotUpdateTime"></span>
    </div>
    <div class="hot-grid" id="hotGrid">
      <div class="search-status" style="padding:20px">
        <div class="text">加载中...</div>
      </div>
    </div>
  </div>

  <!-- 搜索结果 -->
  <div id="searchResults" style="display:none">
    <div class="search-status">
      <div class="icon">🎶</div>
      <div class="text">输入歌名或歌手，点击搜索<br>支持多平台海量曲库</div>
    </div>
  </div>
</div>

<!-- 底部播放栏 -->
<div class="player-bar" id="playerBar">
  <div class="player-inner">
    <div class="player-info">
      <div class="player-album" id="playerAlbum">
        <img src="" alt="" id="playerAlbumImg" style="display:none">
        <div class="placeholder" id="playerAlbumPlaceholder" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#2a2a44;font-size:20px;">🎵</div>
      </div>
      <div class="player-text">
        <div class="name" id="playerSongName">未选择歌曲</div>
        <div class="artist" id="playerArtist">-</div>
      </div>
    </div>
    <div class="player-controls">
      <div class="player-buttons">
        <button class="player-btn" onclick="prevSong()" title="上一首">⏮</button>
        <button class="player-btn play-btn" id="playBtn" onclick="togglePlay()">▶</button>
        <button class="player-btn" onclick="nextSong()" title="下一首">⏭</button>
      </div>
      <div class="player-progress">
        <span class="progress-time" id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar" onclick="seekProgress(event)">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="progress-time" id="totalTime">0:00</span>
      </div>
    </div>
    <div class="player-volume">
      <button class="vol-btn" id="volBtn" onclick="toggleMute()">🔊</button>
      <div class="vol-bar" onclick="setVolume(event)">
        <div class="vol-fill" id="volFill"></div>
      </div>
    </div>
  </div>
</div>

<!-- 隐藏的 audio 元素 -->
<audio id="audioPlayer" preload="auto" 
       controlsList="nodownload noplaybackrate" 
       oncontextmenu="return false;"
       style="display:none"></audio>

<script>
// ============================================================
const API_BASE = '/api/music';
let currentSongList = [];
let currentIndex = -1;
let isPlaying = false;
let isMuted = false;
let previousVolume = 0.6;

const audio = document.getElementById('audioPlayer');
const playerBar = document.getElementById('playerBar');
const playBtn = document.getElementById('playBtn');
const progressFill = document.getElementById('progressFill');
const progressBar = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const volFill = document.getElementById('volFill');
const volBtn = document.getElementById('volBtn');
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
const searchBtn = document.getElementById('searchBtn');

// 设置音量
audio.volume = 0.6;
updateVolUI();

// ---- 热门推荐 ----
const hotSection = document.getElementById('hotSection');
const hotGrid = document.getElementById('hotGrid');
const hotUpdateTime = document.getElementById('hotUpdateTime');

async function loadHotSongs() {
  try {
    const resp = await fetch(`${API_BASE}?action=hot_songs&limit=48`);
    const data = await resp.json();
    const songs = data.songs || [];
    
    if (songs.length === 0) {
      hotGrid.innerHTML = '<div class="search-status" style="padding:20px"><div class="text">暂无热门歌曲，试试搜索吧</div></div>';
      return;
    }
    
    if (data.updatedAt) {
      const d = new Date(data.updatedAt);
      hotUpdateTime.textContent = `更新于 ${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    }
    
    let html = '';
    songs.forEach((song, idx) => {
      const rank = idx + 1;
      const rankClass = rank <= 3 ? 'top3' : '';
      const artists = song.artists?.join(' / ') || '';
      const playIcon = currentSongList.find(s => s.id === song.id) ? '🔊' : '▶';
      html += `
        <div class="hot-item" onclick="playHotSong(${idx})" data-hot-index="${idx}">
          <div class="rank ${rankClass}">${rank}</div>
          <div class="hot-info">
            <div class="name">${song.name}</div>
            <div class="artist">${artists}</div>
          </div>
          <div class="play-icon">${playIcon}</div>
        </div>
      `;
    });
    
    hotGrid.innerHTML = html;
    
    // 保存到全局，用于播放
    window._hotSongs = songs;
  } catch (e) {
    hotGrid.innerHTML = '<div class="search-status" style="padding:20px"><div class="text">加载失败，试试搜索</div></div>';
  }
}

function playHotSong(index) {
  const songs = window._hotSongs || [];
  const song = songs[index];
  if (!song) return;
  
  // 将热门歌曲添加到播放列表
  const existingIdx = currentSongList.findIndex(s => s.id === song.id);
  if (existingIdx >= 0) {
    playSong(existingIdx);
  } else {
    currentSongList.unshift(song);
    playSong(0);
  }
}

// 页面加载时显示热门歌曲
loadHotSongs();

// ---- 搜索 ----
async function searchMusic() {
  const keyword = searchInput.value.trim();
  if (!keyword) return;
  
  // 切换显示
  hotSection.style.display = 'none';
  searchResults.style.display = 'block';
  
  searchBtn.disabled = true;
  searchBtn.textContent = '⏳ 搜索中...';
  searchResults.innerHTML = '<div class="search-status"><div class="icon">🔍</div><div class="text">正在搜索...</div></div>';
  
  try {
    const resp = await fetch(`${API_BASE}?action=search&keyword=${encodeURIComponent(keyword)}`);
    const data = await resp.json();
    renderSongs(data.songs || []);
  } catch (e) {
    searchResults.innerHTML = '<div class="search-status"><div class="icon">😅</div><div class="text">搜索失败，请稍后重试</div></div>';
  } finally {
    searchBtn.disabled = false;
    searchBtn.textContent = '🔍 搜索';
  }
}

// 清空搜索，返回热门推荐
function clearSearch() {
  searchInput.value = '';
  searchResults.style.display = 'none';
  hotSection.style.display = 'block';
  // 重新加载热门歌曲（刷新）
  loadHotSongs();
}

function renderSongs(songs) {
  if (songs.length === 0) {
    searchResults.innerHTML = '<div class="search-status"><div class="icon">😕</div><div class="text">未找到相关歌曲，换个关键词试试</div></div>';
    return;
  }
  
  currentSongList = songs;
  
  let html = '<div class="song-list">';
  songs.forEach((song, idx) => {
    const artists = song.artists.join(' / ');
    const duration = formatDuration(song.duration);
    const albumPic = song.albumPic || '';
    const isActive = idx === currentIndex;
    
    html += `
      <div class="song-item ${isActive ? 'playing' : ''}" onclick="playSong(${idx})" data-index="${idx}">
        <div class="song-album-art">
          ${albumPic ? `<img src="${albumPic}?param=100y100" alt="" loading="lazy">` : '<div class="placeholder">🎵</div>'}
        </div>
        <div class="song-info">
          <div class="song-name">${song.name}</div>
          <div class="song-artist">${artists}</div>
        </div>
        <div class="song-duration">${duration}</div>
        <div class="song-play-icon">${isActive ? '🔊' : '▶'}</div>
      </div>
    `;
  });
  html += '</div>';
  
  searchResults.innerHTML = html;
}

// ---- 播放 ----
async function playSong(index) {
  const song = currentSongList[index];
  if (!song) return;
  
  currentIndex = index;
  
  // 更新播放栏信息
  document.getElementById('playerSongName').textContent = song.name;
  document.getElementById('playerArtist').textContent = song.artists.join(' / ');
  
  const albumImg = document.getElementById('playerAlbumImg');
  const placeholder = document.getElementById('playerAlbumPlaceholder');
  if (song.albumPic) {
    albumImg.src = song.albumPic + '?param=100y100';
    albumImg.style.display = 'block';
    placeholder.style.display = 'none';
  } else {
    albumImg.style.display = 'none';
    placeholder.style.display = 'flex';
  }
  
  playerBar.classList.add('active');
  
  // 获取播放链接
  try {
    const resp = await fetch(`${API_BASE}?action=url&id=${song.id}`);
    const data = await resp.json();
    
    if (data.url) {
      audio.src = data.url;
      audio.play().then(() => {
        isPlaying = true;
        playBtn.textContent = '⏸';
      }).catch(e => {
        showToast('⚠️ 播放失败，请重试');
        isPlaying = false;
        playBtn.textContent = '▶';
      });
    } else {
      showToast('⚠️ 该歌曲暂不可播放（版权限制或需会员）');
      isPlaying = false;
      playBtn.textContent = '▶';
    }
  } catch (e) {
    showToast('⚠️ 获取播放链接失败');
  }
  
  // 更新列表高亮
  document.querySelectorAll('.song-item').forEach(el => {
    el.classList.toggle('playing', parseInt(el.dataset.index) === index);
  });
}

function togglePlay() {
  if (audio.src) {
    if (audio.paused) {
      audio.play();
      isPlaying = true;
      playBtn.textContent = '⏸';
    } else {
      audio.pause();
      isPlaying = false;
      playBtn.textContent = '▶';
    }
  }
}

function prevSong() {
  if (currentSongList.length === 0) return;
  const idx = (currentIndex - 1 + currentSongList.length) % currentSongList.length;
  playSong(idx);
}

function nextSong() {
  if (currentSongList.length === 0) return;
  const idx = (currentIndex + 1) % currentSongList.length;
  playSong(idx);
}

// ---- 音频事件 ----
audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
  }
});

audio.addEventListener('loadedmetadata', () => {
  totalTimeEl.textContent = formatTime(audio.duration);
});

audio.addEventListener('ended', () => {
  nextSong();
});

audio.addEventListener('error', () => {
  if (audio.src) {
    showToast('⚠️ 播放出错，尝试下一首');
    nextSong();
  }
});

// ---- 进度控制 ----
function seekProgress(e) {
  const rect = progressBar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  if (audio.duration) {
    audio.currentTime = pct * audio.duration;
  }
}

// ---- 音量控制 ----
function setVolume(e) {
  const rect = document.querySelector('.vol-bar').getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  audio.volume = pct;
  isMuted = false;
  updateVolUI();
}

function toggleMute() {
  isMuted = !isMuted;
  if (isMuted) {
    previousVolume = audio.volume;
    audio.volume = 0;
  } else {
    audio.volume = previousVolume;
  }
  updateVolUI();
}

function updateVolUI() {
  const vol = isMuted ? 0 : audio.volume;
  volFill.style.width = (vol * 100) + '%';
  volBtn.textContent = vol === 0 ? '🔇' : vol < 0.3 ? '🔈' : vol < 0.7 ? '🔉' : '🔊';
}

// ---- 工具函数 ----
function formatTime(seconds) {
  if (!seconds || isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function formatDuration(ms) {
  if (!ms) return '--:--';
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.textContent = msg;
  toast.style.cssText = `
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.85); color: #fff; padding: 10px 20px;
    border-radius: 8px; font-size: 13px; z-index: 9999;
    animation: fadeIn 0.2s;
  `;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// 禁止右键菜单
document.addEventListener('contextmenu', e => {
  if (e.target.closest('.player-bar') || e.target === audio) {
    e.preventDefault();
  }
});

// 键盘快捷键
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowLeft') { prevSong(); }
  if (e.key === 'ArrowRight') { nextSong(); }
});
</script>
