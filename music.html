<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线音乐播放器 - ToolBox</title>
  <meta name="robots" content="index, follow">
  <link rel="stylesheet" href="css/style.css">
  <!-- 兜底：3.5秒后若 JS 未跳转，则 meta refresh 跳转 -->
  <meta http-equiv="refresh" content="3.5;url=https://flac.music.hi.cn/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    .pc-nav {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 10px 16px; background: #16162a; border-bottom: 1px solid #2a2a44;
    }
    .pc-nav .logo {
      font-weight: 700; font-size: 15px; text-decoration: none;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .pc-nav .sep { color: #2a2a44; font-size: 14px; }
    .pc-nav .title { font-size: 14px; color: #8888aa; font-weight: 500; }
    .pc-nav .spacer { flex: 1; }
    .pc-nav a.btn {
      text-decoration: none; padding: 6px 14px; border-radius: 8px; font-size: 13px;
      border: 1px solid #2a2a44; color: #a0a0c0; transition: all 0.2s; white-space: nowrap;
    }
    .pc-nav a.btn:hover { border-color: #6366f1; color: #fff; }
    .pc-enter {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 40px 20px; text-align: center;
    }
    .pc-enter .spin {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid #2a2a44; border-top-color: #6366f1;
      animation: pcspin 0.9s linear infinite;
    }
    @keyframes pcspin { to { transform: rotate(360deg); } }
    .pc-enter .msg { font-size: 16px; color: #c0c0e0; font-weight: 600; }
    .pc-enter .sub { font-size: 13px; color: #8888aa; line-height: 1.7; }
    .pc-enter .sub a { color: #a78bfa; }
    .pc-enter .big-btn {
      display: inline-block; text-decoration: none; margin-top: 6px;
      padding: 14px 40px; border-radius: 30px; font-size: 16px; font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35); transition: all 0.2s;
    }
    .pc-enter .big-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(99, 102, 241, 0.5); }
    .pc-enter .countdown { font-size: 12px; color: #666688; }
    @media (max-width: 640px) {
      .pc-nav { padding: 8px 12px; gap: 8px; }
    }
  </style>
</head>
<body>

  <!-- ====== 顶部导航（保留 ToolBox 品牌） ====== -->
  <div class="pc-nav">
    <a class="logo" href="index.html">🧰 ToolBox</a>
    <span class="sep">/</span>
    <span class="title">🎵 在线音乐</span>
    <span class="spacer"></span>
    <a class="btn" href="index.html">🏠 返回工具箱</a>
  </div>

  <!-- ====== 跳转过渡页 ====== -->
  <div class="pc-enter">
    <div class="spin"></div>
    <div class="msg">正在进入音乐平台…</div>
    <a class="big-btn" href="https://flac.music.hi.cn/" rel="noopener">🎵 立即进入</a>
    <div class="sub">
      即将跳转到 <a href="https://flac.music.hi.cn/" rel="noopener">flac.music.hi.cn</a><br>
      若未自动跳转，请点击上方按钮<br>
      浏览完毕可用浏览器<span style="color:#a78bfa;">返回键</span>回到工具箱
    </div>
    <div class="countdown" id="countdown">3 秒后自动跳转…</div>
  </div>

  <script>
    // 目标站有 WAF 人机校验，iframe 内第三方 Cookie 受限会导致无限循环"检测/进入"，
    // 因此采用整页跳转（顶层访问时挑战一次通过）
    (function() {
      var TARGET = 'https://flac.music.hi.cn/';
      var seconds = 3;
      var cdEl = document.getElementById('countdown');
      var timer = setInterval(function() {
        seconds--;
        if (cdEl) cdEl.textContent = seconds + ' 秒后自动跳转…';
        if (seconds <= 0) {
          clearInterval(timer);
          window.location.href = TARGET;
        }
      }, 1000);
    })();
  </script>

</body>
</html>
