<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线音乐播放器 - ToolBox</title>
  <meta name="robots" content="index, follow">
  <link rel="stylesheet" href="css/style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .pc-nav {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 10px 16px; background: #16162a; border-bottom: 1px solid #2a2a44;
      position: sticky; top: 0; z-index: 1000;
    }
    .pc-nav .logo {
      font-weight: 700; font-size: 15px; text-decoration: none;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .pc-nav .sep { color: #2a2a44; font-size: 14px; }
    .pc-nav .title { font-size: 14px; color: #8888aa; font-weight: 500; }
    .pc-nav .spacer { flex: 1; }
    .pc-nav a.btn {
      text-decoration: none; padding: 6px 14px; border-radius: 8px; font-size: 13px;
      border: 1px solid #2a2a44; color: #a0a0c0; transition: all 0.2s; white-space: nowrap;
    }
    .pc-nav a.btn:hover { border-color: #6366f1; color: #fff; }
    .pc-nav a.btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; color: #fff; font-weight: 600;
    }
    .pc-nav a.btn-primary:hover { opacity: 0.85; color: #fff; }
    .pc-body { width: 100%; height: calc(100vh - 46px); position: relative; background: #0f0f1a; }
    .pc-body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: block; z-index: 2; }
    .pc-loading {
      position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; color: #8888aa; font-size: 14px;
      background: #0f0f1a;
    }
    .pc-loading .spin {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid #2a2a44; border-top-color: #6366f1;
      animation: pcspin 0.9s linear infinite;
    }
    @keyframes pcspin { to { transform: rotate(360deg); } }
    .pc-loading a { color: #a78bfa; text-decoration: none; }
    .pc-loading a:hover { text-decoration: underline; }
    @media (max-width: 640px) {
      .pc-nav { padding: 8px 12px; gap: 8px; }
      .pc-body { height: calc(100vh - 42px); }
    }
  </style>
</head>
<body>

  <!-- ====== 顶部导航（保留 ToolBox 品牌 + 兜底直达链接） ====== -->
  <div class="pc-nav">
    <a class="logo" href="index.html">🧰 ToolBox</a>
    <span class="sep">/</span>
    <span class="title">🎵 在线音乐</span>
    <span class="spacer"></span>
    <a class="btn" href="index.html">🏠 返回工具箱</a>
    <a class="btn btn-primary" href="https://flac.music.hi.cn/" target="_blank" rel="noopener">⛵ 打不开？直接访问原站 ↗</a>
  </div>

  <!-- ====== 音乐平台（套壳 flac.music.hi.cn） ====== -->
  <div class="pc-body">
    <!-- 加载提示层：iframe onload 后自动隐藏 -->
    <div class="pc-loading" id="pcLoading">
      <div class="spin"></div>
      <div>⏳ 正在加载音乐平台…</div>
      <div style="font-size:12px;">加载缓慢？<a href="https://flac.music.hi.cn/" target="_blank" rel="noopener">点击直接打开原站 ↗</a></div>
    </div>
    <iframe
      id="musicFrame"
      src="https://flac.music.hi.cn/"
      title="在线音乐播放器"
      allow="autoplay; encrypted-media; picture-in-picture"
      loading="lazy"
      onload="document.getElementById('pcLoading').style.display='none'">
    </iframe>
  </div>

</body>
</html>
